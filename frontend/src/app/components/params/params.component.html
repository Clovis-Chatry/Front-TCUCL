<!-- Bouton de retour -->
<div class="top-bar">
  <button class="back-button" (click)="goBackToDashboard()">← Retour au tableau de bord</button>
</div>

<div class="params-container">

  <!-- Section: Paramètres personnels -->
  <section class="card" data-title="Paramètres personnels">
    <form>
      <label>Prénom</label>
      <input type="text" [(ngModel)]="user.firstName" name="firstName">

      <label>Nom</label>
      <input type="text" [(ngModel)]="user.lastName" name="lastName">

      <label>Email</label>
      <input type="email" [(ngModel)]="user.email" name="email">

      <button type="button" (click)="updateInfo()"
              [disabled]="!user.firstName || !user.lastName || !user.email||
    !isEmailValid(user.email)" class="btn-update">
        Changer ses informations
      </button>
    </form>
  </section>

  <!-- Section: Réinitialisation mot de passe -->
  <section class="card" data-title="Changer son mot de passe">
    <button class="password-reset" (click)="sendPasswordReset()">Envoyer un mail de réinitialisation</button>
  </section>

  <!-- Grille des blocs params -->
  <div class="params-grid">
    <!-- Section: Créer une entité -->
    <div *ngIf="isSuperAdmin()">
      <section class="card" data-title="Créer une entité">
        <form>

          <p class="section-info">Paramètres de l'entité</p>

          <label>Nom</label>
          <input type="text" [(ngModel)]="entity.name" name="entityName">

          <label>Type</label>
          <select [(ngModel)]="entity.type" name="entityType">
            <option>Enseignement Supérieur</option>
            <option>Collectivité</option>
          </select>

          <p class="section-info">Profil du premier admin de l'entité</p>

          <label>Prénom</label>
          <input type="text" placeholder="Prénom" [(ngModel)]="entity.admin.firstName" name="adminFirstName">

          <label>Nom</label>
          <input type="text" placeholder="Nom" [(ngModel)]="entity.admin.lastName" name="adminLastName">

          <label>Email</label>
          <input type="email" placeholder="Email" [(ngModel)]="entity.admin.email" name="adminEmail">

          <button type="button" (click)="createEntity()">Créer l'entité</button>
        </form>
      </section>
    </div>
    <!-- Section: Ajouter un utilisateur Super Admin-->
    <div *ngIf="isSuperAdmin()">
      <section class="card" data-title="Ajouter un utilisateur à une entité">
        <form>
          <label>Sélectionner l'entité</label>
          <select [(ngModel)]="newUserEntity" name="newUserEntity">
            <option *ngFor="let e of entities">{{ e.name }}</option>
          </select>

          <label>Prénom</label>
          <input type="text" placeholder="Prénom" [(ngModel)]="entity.admin.firstName" name="adminFirstName">

          <label>Nom</label>
          <input type="text" placeholder="Nom" [(ngModel)]="entity.admin.lastName" name="adminLastName">

          <label>Email</label>
          <input type="email" placeholder="Email" [(ngModel)]="entity.admin.email" name="adminEmail">

          <div class="checkbox-line">
            <input type="checkbox" id="adminCheckbox" [(ngModel)]="entity.admin.isAdmin" name="adminIsAdmin">
            <label for="adminCheckbox">Utilisateur avec rôle "Admin"</label>
          </div>

        </form>
        <button type="button"
                (click)="createEntity()"
                [disabled]="!entity.name || !entity.type || !entity.admin.firstName || !entity.admin.lastName || !entity.admin.email || !isEmailValid(entity.admin.email)"
                class="btn-update">
          Créer l'entité
        </button>
      </section>
    </div>

    <!-- Section: Ajouter un utilisateur Admin-->
    <div *ngIf="isAdmin()">
      <section class="card" data-title="Ajouter un utilisateur">
        <form>
          <label>Prénom</label>
          <input type="text" placeholder="Prénom" [(ngModel)]="entity.admin.firstName" name="adminFirstName">

          <label>Nom</label>
          <input type="text" placeholder="Nom" [(ngModel)]="entity.admin.lastName" name="adminLastName">

          <label>Email</label>
          <input type="email" placeholder="Email" [(ngModel)]="entity.admin.email" name="adminEmail">

          <div class="checkbox-line">
            <input type="checkbox" id="adminCheckbox" [(ngModel)]="entity.admin.isAdmin" name="adminIsAdmin">
            <label for="adminCheckbox">Utilisateur avec rôle "Admin"</label>
          </div>

        </form>
        <button type="button"
                (click)="createEntity()"
                [disabled]="!entity.admin.firstName || !entity.admin.lastName || !entity.admin.email || !isEmailValid(entity.admin.email)"
                class="btn-update">
          Créer l'entité
        </button>
      </section>
    </div>

    <!-- Section: Gestion des utilisateurs Super Admin-->
    <div *ngIf="isSuperAdmin()">
      <section class="card" data-title="Gestion des utilisateurs">
        <label>Entité :</label>
        <select [(ngModel)]="selectedEntity" name="selectedEntity">
          <option *ngFor="let e of entities" [value]="e.name">{{ e.name }}</option>
        </select>

        <table class="user-table">
          <thead>
          <tr>
            <th>NOM</th>
            <th>Prénom</th>
            <th>admin</th>
            <th>Action</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let user of filteredUsers()">
            <td>{{ user.lastName }}</td>
            <td>{{ user.firstName }}</td>
            <td><input type="checkbox" [checked]="user.isAdmin" disabled></td>
            <td>
              <button title="Modifier">✏️</button>
              <button title="Supprimer">🗑️</button>
            </td>
          </tr>
          </tbody>
        </table>
      </section>
    </div>
    <!-- Section: Gestion des utilisateurs Admin-->
    <div *ngIf="isAdmin()">
      <section class="card" data-title="Gestion des utilisateurs">
        <table class="user-table">
          <thead>
          <tr>
            <th>NOM</th>
            <th>Prénom</th>
            <th>admin</th>
            <th>Action</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let user of filteredUsers()">
            <td>{{ user.lastName }}</td>
            <td>{{ user.firstName }}</td>
            <td><input type="checkbox" [checked]="user.isAdmin" disabled></td>
            <td>
              <button title="Modifier">✏️</button>
              <button title="Supprimer">🗑️</button>
            </td>
          </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>
</div>
