<div class="main-container">
  <!-- Section 1 : Parc immobilier -->
  <h2>Parc immobilier</h2>
  <div *ngFor="let bat of batiments; let i = index">
    <input [(ngModel)]="bat.nom_ou_adresse" placeholder="Nom ou adresse">
    <input type="number" [(ngModel)]="bat.surfaceEnM2" placeholder="Surface (m²)">
    <input type="date" [(ngModel)]="bat.dateConstruction" placeholder="Date construction">
    <input type="date" [(ngModel)]="bat.dateDerniereGrosseRenovation" placeholder="Date rénovation">
    <button (click)="supprimerBatiment(i)">Supprimer</button>
  </div>
  <button (click)="ajouterBatiment()">Ajouter un bâtiment</button>
  <hr/>

  <!-- Section 2 : Entretien et rénovations -->
  <h2>Entretiens et rénovations</h2>
  <div *ngFor="let ent of entretiens; let i = index">
    <input [(ngModel)]="ent.nom_adresse" placeholder="Nom / adresse">
    <input [(ngModel)]="ent.surfaceConcernee" type="number" placeholder="Surface concernée (m²)">
    <input type="date" [(ngModel)]="ent.dateTravaux" placeholder="Date des travaux">
    <button (click)="supprimerEntretien(i)">Supprimer</button>
  </div>
  <button (click)="ajouterEntretien()">Ajouter un entretien</button>
  <hr/>

  <!-- Section 3 : Mobilier -->
  <h2>Mobilier</h2>
  <span class="help-icon" title="Merci de renseigner le nombre de chaque type d'équipements en cours d'amortissement comptable, la durée d'amortissement et idéalement le poids moyen pour les armoires, lits et tables (les données ADEME sont basées sur des armoires de plusieurs centaines de kilos par exemple, ce qui peut biaiser le calcul).
    Si vous connaisez l'impact carbone du produit en question, vous pouvez l'indiquer pour plus de précisions.">
        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="black"></circle>
          <rect x="11" y="10" width="2" height="6" fill="white"></rect>
          <circle cx="12" cy="8" r="1" fill="white"></circle>
        </svg>
    </span>
  <details>
    <summary><strong>Saisir du mobilier</strong></summary>

    <label>Type de mobilier :
      <select [(ngModel)]="nouveauMobilier.mobilier">
        <option *ngFor="let type of mobilierTypesLibelles" [ngValue]="type.value">
          {{ type.label }}
        </option>
      </select>
    </label>

    <label>Nombre :
      <input type="number" [(ngModel)]="nouveauMobilier.quantite"/>
    </label>

    <label>Poids (kg) :
      <input type="number" [(ngModel)]="nouveauMobilier.poidsDuProduit"/>
    </label>

    <label>Durée amortissement (année) :
      <input type="number" [(ngModel)]="nouveauMobilier.dureeAmortissement"/>
    </label>

    <button (click)="ajouterMobilier()">Ajouter ce mobilier</button>
  </details>

  <div class="mobilier-table" *ngIf="batimentOnglet.mobiliers.length > 0">
    <h3>Liste du mobilier saisi</h3>
    <table class="data-table">
      <thead>
      <tr>
        <th>Mobilier</th>
        <th>Quantité</th>
        <th>Poids (kg)</th>
        <th>Durée amortissement</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let mobilier of batimentOnglet.mobiliers; let i = index">
        <td>{{ getLibelleTypeMobilier(mobilier.mobilier) }}</td>
        <td>{{ mobilier.quantite }}</td>
        <td>{{ mobilier.poidsDuProduit }}</td>
        <td>{{ mobilier.dureeAmortissement }}</td>
        <td>
          <button (click)="supprimerMobilier(i)">🗑️</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <hr/>
  <app-save-footer [path]="ONGLET_KEYS.Batiments" (estTermineChange)="onEstTermineChange($event)"></app-save-footer>
</div>
