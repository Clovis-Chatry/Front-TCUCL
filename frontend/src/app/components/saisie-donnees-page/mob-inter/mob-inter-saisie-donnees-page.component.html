<div class="main-container">
  <div class="left-panel">
    <div class="page-title">
      <h2>Mobilité internationale</h2>
      <span class="help-icon" title="Merci de renseigner les nombres de déplacements (1 déplacement = 1 aller simple) selon chaque destination à l'internationale pour chaque public cible. Certaines destinations européennes semblent accessibles en train/bus et il est donc possible d'indiquer si les déplacementts se font en train/bus ou avion pour ces dernières. Si le trajet s'est fait en co voiturage ou bus, alors mettre le nombre dans la colonne 'train', si le trajet s'est fait en voiture individuelle, alors mettre le nombre dans 'avion'.">
        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="black"></circle>
          <rect x="11" y="10" width="2" height="6" fill="white"></rect>
          <circle cx="12" cy="8" r="1" fill="white"></circle>
        </svg>
      </span>
    </div>

    <details>
      <summary><strong>Saisir une destination</strong></summary>

      <div class="form-column">
        <label>Quel est le pays de destination ?
          <select [(ngModel)]="nouveauVoyage.nomPays" (change)="updateData()">
            <option *ngFor="let pays of listePays" [value]="pays">{{ pays }}</option>
          </select>
        </label>

        <table class="data-table">
          <thead>
            <tr>
              <th>Moyen</th>
              <th>Pro</th>
              <th>Stage étudiant</th>
              <th>Semestre étudiant</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Avion</td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.prosAvion" (blur)="updateData()" /></td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.stagesEtudiantsAvion" (blur)="updateData()" /></td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.semestresEtudiantsAvion" (blur)="updateData()" /></td>
            </tr>
            <tr>
              <td>Train / Bus</td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.prosTrain" (blur)="updateData()" /></td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.stagesEtudiantsTrain" (blur)="updateData()" /></td>
              <td><input type="number" [(ngModel)]="nouveauVoyage.semestresEtudiantsTrain" (blur)="updateData()" /></td>
            </tr>
          </tbody>
        </table>
      </div>

      <button type="button" (click)="ajouterVoyage()">Ajouter ce pays</button>
    </details>

    <div *ngIf="onglet.voyages.length > 0" class="added-destinations">
      <h3>Destinations enregistrées :</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Pays</th>
            <th>Moyen</th>
            <th>Pro</th>
            <th>Stage étudiant</th>
            <th>Semestre étudiant</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let destination of onglet.voyages; let i = index">
            <tr>
              <td rowspan="2">{{ destination.nomPays }}</td>
              <td><span class="icon">🚆</span></td>
              <td><input type="number" [value]="destination.prosTrain" readonly /></td>
              <td><input type="number" [value]="destination.stagesEtudiantsTrain" readonly /></td>
              <td><input type="number" [value]="destination.semestresEtudiantsTrain" readonly /></td>
              <td rowspan="2">
                <button (click)="supprimerVoyage(i)">🗑️</button>
              </td>
            </tr>
            <tr>
              <td><span class="icon">✈️</span></td>
              <td><input type="number" [value]="destination.prosAvion" readonly /></td>
              <td><input type="number" [value]="destination.stagesEtudiantsAvion" readonly /></td>
              <td><input type="number" [value]="destination.semestresEtudiantsAvion" readonly /></td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
  <app-save-footer [path]="ONGLET_KEYS.MobInternationale" (estTermineChange)="onEstTermineChange($event)"></app-save-footer>
</div>
